name: chess-llama

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - '127.0.0.1:${NGINX_PORT}:8080'
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      DATABASE_PATH: /data/chess-llama.sqlite
      LLAMA_BASE_URL: http://llama:8080
      LOG_LEVEL: ${BACKEND_LOG_LEVEL}
      CHESS_LLAMA_DEMO_TRACE: ${BACKEND_DEMO_TRACE}
    volumes:
      - database:/data
    depends_on:
      llama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(async (response) => { if (!response.ok || (await response.json()).status !== 'ready') process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

  llama:
    build:
      context: .
      dockerfile: llama/Dockerfile
    environment:
      LLAMA_PROFILE_ID: ${LLAMA_PROFILE_ID}
      LLAMA_MANIFEST_PATH: /opt/chess-llama/runtime-manifest.json
      LLAMA_MODEL_DIRECTORY: /models
      LLAMA_CONTEXT_SIZE: ${LLAMA_CONTEXT_SIZE}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS}
    gpus: all
    volumes:
      - models:/models
    healthcheck:
      test:
        [CMD, /usr/bin/curl, --fail, --silent, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

volumes:
  database:
  models:
