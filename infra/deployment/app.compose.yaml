services:
  workspace-bootstrap:
    image: ${NODE_IMAGE}
    user: '0:0'
    command: [node, /source/infra/deployment/workspace-bootstrap.mjs]
    environment:
      SOURCE_DIRECTORY: /source
      WORKSPACE_DIRECTORY: /workspace
      DATABASE_DIRECTORY: /data
      COREPACK_HOME: /pnpm/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
      XDG_CACHE_HOME: /pnpm/cache
      HOME: /tmp
    volumes:
      - .:/source:ro
      - workspace:/workspace
      - pnpm:/pnpm
      - database:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

  gateway:
    image: ${NODE_IMAGE}
    user: '1000:1000'
    working_dir: /workspace/current
    command: [node, /workspace/current/apps/gateway/dist/main.js]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      DATABASE_PATH: /data/chess-llama.sqlite
      LLAMA_BASE_URL: http://llama:8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      CHESS_LLAMA_DEMO_TRACE: ${CHESS_LLAMA_DEMO_TRACE}
    ports:
      - '127.0.0.1:${GATEWAY_PORT}:3001'
    volumes:
      - workspace:/workspace:ro
      - database:/data
    depends_on:
      workspace-bootstrap:
        condition: service_completed_successfully
      llama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(async (response) => { if (!response.ok || (await response.json()).status !== 'ready') process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

  client:
    image: ${NGINX_IMAGE}
    ports:
      - '127.0.0.1:${CLIENT_PORT}:8080'
    volumes:
      - workspace:/workspace:ro
      - ./infra/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    tmpfs: [/tmp]

volumes:
  workspace:
  pnpm:
  database:
