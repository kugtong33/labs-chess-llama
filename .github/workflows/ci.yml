name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm with Corepack
        run: |
          corepack enable
          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"
          case "$package_manager" in
            pnpm@*) ;;
            *)
              echo "Root package.json must declare a pnpm packageManager; found: $package_manager" >&2
              exit 1
              ;;
          esac
          corepack prepare "$package_manager" --activate
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Validate root Compose deployment config
        run: docker compose config --quiet

      - name: Validate service Dockerfiles
        run: |
          for dockerfile in nginx/Dockerfile web/Dockerfile backend/Dockerfile llama/Dockerfile; do
            docker build --check --file "$dockerfile" .
          done

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Check Bash formatting
        run: pnpm format:shell:check

      - name: Lint
        run: pnpm lint

      - name: Lint Bash
        run: pnpm lint:shell

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Run Bash behavior tests
        run: pnpm test:shell

      - name: Build production bundles
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: pnpm test:e2e

      - name: Check license policy and third-party notices
        run: |
          pnpm notices
          git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  prepare-runtime-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      images: ${{ steps.runtime-images.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read unique runtime images from service Dockerfiles
        id: runtime-images
        run: |
          echo "images=$(node scripts/container-images.mjs)" >> "$GITHUB_OUTPUT"

  verify-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Apple Silicon prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install bash llama.cpp shellcheck shfmt
          bash --version
          llama-server --help >/dev/null

      - name: Enable pinned pnpm with Corepack
        run: |
          corepack enable
          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"
          corepack prepare "$package_manager" --activate
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-arm64-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-node24-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check Bash formatting
        run: shfmt -d -i 2 -ci chess-llama scripts/cli tests/shell

      - name: Lint
        run: pnpm lint

      - name: Lint Bash
        run: shellcheck chess-llama scripts/cli/*.sh tests/shell/*.bash tests/shell/*.bats

      - name: Type-check
        run: pnpm typecheck

      - name: Run portable and native-provider tests
        run: pnpm test:macos

      - name: Build production bundles
        run: pnpm build

  container-security:
    needs: prepare-runtime-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare-runtime-images.outputs.images) }}
    steps:
      - name: Scan pinned runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
